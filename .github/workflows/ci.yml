name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run seo:recover-urls
      - run: npm run seo:build-canonical-db
      - run: npm run seo:build-redirect-map
      - run: npm run seo:generate-sitemap
      - run: npm run seo:generate-reports
      - run: npm run seo:generate-sc-reconciliation
      - run: npm run verify:canonical
      - run: npm run verify:redirects
      - run: npm run verify:sitemap
      - run: npm run verify:robots
      - run: npm run verify:seo
      - run: npx tsx scripts/verify-routes.ts
      - run: npm run build

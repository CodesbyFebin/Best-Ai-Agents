name: Temporary exact-head release verification

on:
  push:
    branches:
      - tmp/release-lockfile-3d80b057

permissions:
  contents: read

jobs:
  verify-exact-head:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5a7bf1030ef7b5016dfad0af1dacb8a360c682a9
      - name: Prove exact source SHA
        run: test "$(git rev-parse HEAD)" = "5a7bf1030ef7b5016dfad0af1dacb8a360c682a9"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Typecheck Next application
        run: npm run typecheck
      - name: Typecheck legacy API and Express server
        run: ./node_modules/.bin/tsc --noEmit --strict --skipLibCheck --esModuleInterop --module esnext --moduleResolution bundler --target ES2022 --types node api/index.ts server/app.ts
      - name: Verify pillars
        run: npm run verify:pillars
      - name: Verify routes
        run: npm run verify:routes
      - name: Test aggregate
        run: npm run test
      - name: Verify all
        run: npm run verify:all

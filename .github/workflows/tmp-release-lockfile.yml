name: Temporary release lockfile generation

on:
  push:
    branches:
      - tmp/release-lockfile-3d80b057

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Verify pillars
        run: npm run verify:pillars
      - name: Verify routes
        run: npm run verify:routes
      - name: Test aggregate
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Persist generated lockfile on scratch branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already persisted."
          else
            git commit -m "chore(tmp): persist generated lockfile [skip ci]"
            git push origin HEAD:tmp/release-lockfile-3d80b057
          fi

name: Bug report
description: Report a problem with the site, a page, or the build/verify tooling.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill this in accurately — do not include
        secrets or private vulnerability details (use the Security policy instead).
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version (`node -v`), and how you ran it (dev/build).
      placeholder: "macOS 14, Node 22.13, `npm run dev`"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit / version
      description: The exact commit SHA or `npm pkg get version`.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Run `npm run dev`
        2. Open `/compare`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Paste console or build output. No secrets.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `npm run verify:all` and it failed
        - label: I have not included any secrets
